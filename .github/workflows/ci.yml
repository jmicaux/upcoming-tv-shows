name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure the TMDB key file is not committed
        run: |
          if git ls-files --error-unmatch config.js >/dev/null 2>&1; then
            echo "::error::config.js must never be committed (it holds the TMDB key)."
            exit 1
          fi

      - name: Ensure no secrets or local notes are committed
        run: |
          bad=$(git ls-files | grep -iE '(credential|secret|password|\.env($|\.)|\.txt$|^docs/superpowers/)' | grep -v '^robots\.txt$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must not be committed:"; echo "$bad"; exit 1
          fi

      - name: Check JS syntax
        run: |
          find . -name '*.js' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Run unit tests
        run: node --test tests/

      - name: Build the generated pages
        run: node tools/make-pages.js

      - name: Validate HTML
        run: npx --yes html-validate '**/*.html'
