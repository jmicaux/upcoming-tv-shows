name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure the TMDB key file is not committed
        run: |
          if git ls-files --error-unmatch config.js >/dev/null 2>&1; then
            echo "::error::config.js must never be committed (it holds the TMDB key)."
            exit 1
          fi

      - name: Check JS syntax
        run: |
          find . -name '*.js' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Validate HTML
        run: npx --yes html-validate '**/*.html'
