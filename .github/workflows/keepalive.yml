name: Supabase keep-alive

# Free-tier Supabase projects pause after a week without activity. One tiny read on Monday
# and Thursday keeps the account sync available, with a spare run if one fails.
# Note: GitHub disables scheduled workflows after 60 days without a commit — re-enable it
# in the Actions tab if that happens.
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read the public Supabase settings
        id: cfg
        run: |
          node -e '
            globalThis.window = {};
            require("./supabase-config.js");
            const c = window.UPCOMING_SUPABASE;
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `url=${c.URL}\nkey=${c.ANON_KEY}\n`);
          '
      - name: Ping the REST API
        if: steps.cfg.outputs.url != ''
        run: |
          curl -fsS "${{ steps.cfg.outputs.url }}/rest/v1/preferences?select=user_id&limit=1" \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -H "Authorization: Bearer ${{ steps.cfg.outputs.key }}" > /dev/null
          echo "Supabase pinged."
      - name: Skipped
        if: steps.cfg.outputs.url == ''
        run: echo "::notice::supabase-config.js has no URL — nothing to keep alive."
