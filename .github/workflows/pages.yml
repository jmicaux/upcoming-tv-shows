name: Deploy site with schedule snapshot

# Builds the site every night and on every push to main: fetches the schedule once
# (tools/fetch-schedule.js), bakes the upcoming shows into the channel pages
# (tools/make-pages.js --data) and deploys to GitHub Pages. Visitors and crawlers then
# read same-origin JSON and HTML instead of calling TVmaze themselves.
# Requires Settings → Pages → Source: "GitHub Actions". Optional secret TMDB_KEY adds the
# French channels to the snapshot.

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Nightly run: fresh data from TVmaze/TMDB (~8 min). Code deploy (push, manual run):
      # reuse the snapshot already published on the site (seconds), unless it is missing
      # or older than 36 h. A failed source is left out of the snapshot (fetched live).
      - name: Get the schedule snapshot
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          SITE_URL: https://jmicaux.github.io/upcoming-tv-shows/
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && node tools/pull-snapshot.js "$SITE_URL" data/schedule 36; then
            echo "Snapshot reused."
          else
            node tools/fetch-schedule.js data/schedule 3
          fi

      # Bakes the upcoming shows into the channel and country pages, then copies only what
      # the site needs (allow-list in tools/build-dist.js) into dist/.
      - name: Assemble the site
        run: node tools/build-dist.js --data data/schedule

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
